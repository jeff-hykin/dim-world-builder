# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: World Builder
version: "0.3.0"
spec-version: v1.5
uses:
    "@desktop-gateway":
        # what this server reads of DIMOS_APP; `app check` says when Desktop doesn't set one, and a launch that
        # can't resolve one says so in this app's own log
        env:
            DIMOS_APP.socket: the unix socket this server binds
            DIMOS_APP.name: names this install in its own links
            DIMOS_APP.dataDir: its own folder, for the worlds it keeps
            DIMOS_APP.desktopUrl: Desktop's loopback origin, which its own API is reached through
        endpoints:
            # export/open with show: switch World Builder's open pages to the world, and open it in the user's window
            - POST /ui/apps/{pkg}/frontend/{topic}
            - POST /ui/apps/{pkg}/open
            # dimos-react's zenoh client: where the zenoh-gateway and this app's namespace are
            - GET /management/gateways/zenoh
    # viewer mode: the running simulation's TF (robot + moving objects) and lidar, through Desktop's zenoh-gateway
    "@zenoh-gateway": ">=0.5 <0.6"
# spec v1.2: the page only reads; it never publishes (no command topics)
zenoh:
    default_permission: deny
    read:
        - id: live-world
          messages: [declare_subscriber, put]
          key_exprs:
              - "dimos/**/tf2_msgs.TFMessage"
              - "dimos/**/sensor_msgs.PointCloud2"
              - "dimos/**/geometry_msgs.PoseStamped"
              - "dimos/**/sensor_msgs.JointState"
          permission: allow
        # dimos-react's app provider listens for this app's own backend events (Desktop's <namespace>/apps/<app>/frontend)
        - id: own-events
          messages: [declare_subscriber, put]
          key_exprs: ["dimos-desktop/*/apps/dim-world-builder/frontend/**"]
          permission: allow
caches:
    - url: https://dimos-desktop.cachix.org
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    openapi: 3.1.0
    info:
        title: World Builder
        version: 1.0.0
        description: >-
            World Builder: makes 3D worlds (rooms, floors, stairs, hills, furniture, moving obstacles) for simulated robots
            and exports them for dimos sim2
        x-when: you need to build a 3D world for a simulated robot or export one to dimos sim2
    x-private:
        - api/internal/*
        - files/*
    paths:
        /api/export:
            post:
                description: >-
                    Write a world as a dimos sim2 scene folder <parentDir>/<name>/ (scene.xml, scene.json, a Python package)
                    and also save the project. Returns { dir, name, files, bodies, movers, warnings }; warnings lists items
                    that clip into each other
                x-when: you want a world as a dimos sim2 scene to run in simulation
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    project:
                                        type: object
                                        description: the world (dim-world-builder.project.v1); or give name
                                    name:
                                        type: string
                                        description: the name of a saved world to export instead of a project
                                    parentDir:
                                        type: string
                                        description: the folder to write <name>/ into (default ~/dimos_worlds)
        /api/library:
            get:
                description: >-
                    Every placeable 3D asset (built-in library and cooked imports) as a JSON list, each with its id, size
                    and collision pieces
                x-when: you need the ids and sizes of the assets you can place in a world
                x-dimos-role: context
        /api/projects:
            get:
                summary: 'The names of the saved worlds, as { projects: [name] }'
                x-when: you need to know which worlds are saved
                x-dimos-role: context
        /api/open:
            post:
                description: >-
                    Open a world in World Builder for the user: Desktop opens (or switches to) World Builder showing it, and
                    any World Builder page already open switches to it. Give the name of a saved world, a path on this
                    machine (a project .json, an export's scene.json, or an export's folder), or a project as JSON. A
                    project file opened by path keeps saving back to that file. Returns { opened, items, savesTo?, shown,
                    note? }; shown is false when no Desktop window is open (note says why)
                x-when: you want to show the user a world, or open a world file for them to edit
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: a saved world's name (GET /api/projects lists them)
                                    path:
                                        type: string
                                        description: a file or export folder on this machine (~ allowed)
                                    project:
                                        type: object
                                        description: a dim-world-builder.project.v1 project, or an export's scene.json
                                    show:
                                        type: boolean
                                        description: open World Builder in front of the user (default true); false only switches pages already open
        /api/project:
            get:
                description: >-
                    A saved world's project (rooms, stairs, items, floors, movers, nav test) as JSON; 404 if there is no such
                    world
                x-when: you need to read the full contents of a saved world
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
            post:
                description: >-
                    Save (create or replace) a world project under its name (snake_cased). Returns { saved: name, items: count
                    }; 400 if the project is not dim-world-builder.project.v1
                x-when: you want to save a whole world you built or edited yourself
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    project:
                                        type: object
                                        description: the world (dim-world-builder.project.v1)
        /api/project/items:
            post:
                description: >-
                    Add items to a saved world. Each item: kind (primitive|mesh|room|stairs|hill|hole|apriltag|light), params,
                    and optionally name, floor (default the active floor), position [x,y,z], rotation [x,y,z,w], scale, mover.
                    Returns { added: [item id], items: count, warnings }; warnings lists items that now clip into each other
                x-when: you want to add objects, rooms, stairs or obstacles to a saved world
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    items:
                                        type: array
                                        description: the items to add
        /api/generate:
            post:
                description: >-
                    Generate and save a world (playground is a big two-floor test scene; test_course, clutter_yard, empty).
                    Returns { saved: name, items: count, warnings }; warnings lists items that clip into each other
                x-when: you want a ready-made test world to start from
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    kind:
                                        type: string
                                        description: playground | test_course | clutter_yard | empty
                                    name:
                                        type: string
                                        description: the new world's name (optional)
                                    seed:
                                        type: number
                                        description: for playground (optional)
        /api/check:
            post:
                description: >-
                    Which items clip into each other: MuJoCo checks every pair of collision shapes (floors and hills excluded).
                    clips: [{a, b (key, name, kind), depth_m, at [x,y,z]}], warnings: one line each
                x-when: you need to know whether items in a world overlap
                x-dimos-role: context
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: a saved world's name
                                    project:
                                        type: object
                                        description: a world (dim-world-builder.project.v1) instead of a saved one
                                    tolerance:
                                        type: number
                                        description: meters of overlap to ignore (default 0.02)
        /api/views:
            get:
                description: >-
                    A saved world's remembered camera views as { views: [{ key, name, eye, target, fov }] }; each is a MuJoCo
                    camera named by its key in the export
                x-when: you need the camera views remembered for a saved world
                x-dimos-role: context
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
            post:
                description: >-
                    Remember a camera view in a saved world (its key comes from the view's name; the same key replaces it).
                    Returns { saved: key, views: count }
                x-when: you want to remember a camera angle on a saved world
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    view:
                                        type: object
                                        description: '{ name, eye: [x,y,z], target: [x,y,z], fov (vertical degrees, default
                                            50) }'
        /api/views/remove:
            post:
                summary: 'Forget a remembered view of a saved world. Returns { removed: count }'
                x-when: you want to forget a remembered camera view
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    view:
                                        type: string
                                        description: the view's key
        /api/views/image:
            get:
                summary: A PNG of the world (as exported, rendered by MuJoCo) seen from a remembered view
                x-when: you want to see what a world looks like from a remembered view
                x-dimos-role: view
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
                    -   name: view
                        in: query
                        schema:
                            type: string
                        description: the view's key
                    -   name: width
                        in: query
                        schema:
                            type: number
                        description: pixels (default 960, at most 1920)
                    -   name: height
                        in: query
                        schema:
                            type: number
                        description: pixels (default 540, at most 1920)
