# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: World Builder
version: "0.2.2"
spec-version: v1.4
uses:
    "@desktop-gateway":
        # export/open with show: switch World Builder's open pages to the world, and open it in the user's window
        - POST /ui/apps/{pkg}/frontend/{topic}
        - POST /ui/apps/{pkg}/open
        # dimos-react's zenoh client: where the zenoh-gateway and this app's namespace are
        - GET /management/gateways/zenoh
    # viewer mode: the running simulation's TF (robot + moving objects) and lidar, through Desktop's zenoh-gateway
    "@zenoh-gateway": ">=0.5 <0.6"
# spec v1.2: the page only reads; it never publishes (no command topics)
zenoh:
    default_permission: deny
    read:
        - id: live-world
          messages: [declare_subscriber, put]
          key_exprs:
              - "dimos/**/tf2_msgs.TFMessage"
              - "dimos/**/sensor_msgs.PointCloud2"
              - "dimos/**/geometry_msgs.PoseStamped"
              - "dimos/**/sensor_msgs.JointState"
          permission: allow
        # dimos-react's app provider listens for this app's own backend events (Desktop's <namespace>/apps/<app>/frontend)
        - id: own-events
          messages: [declare_subscriber, put]
          key_exprs: ["dimos-desktop/*/apps/dim-world-builder/frontend/**"]
          permission: allow
caches:
    - url: https://dimos-desktop.cachix.org
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    openapi: 3.1.0
    info:
        title: World Builder
        version: 1.0.0
        description: >-
            World Builder: makes 3D worlds (rooms, floors, stairs, hills, furniture, moving obstacles) for simulated robots
            and exports them for dimos sim2
        x-when: you need to build a 3D world for a simulated robot or export one to dimos sim2
    x-private:
        - api/internal/*
        - files/*
    paths:
        /api/export:
            post:
                description: >-
                    Write a world as a dimos sim2 scene folder <parentDir>/<name>/ (scene.xml, scene.json, a Python package)
                    and also save the project. Returns { dir, name, files, bodies, movers, warnings }; warnings lists items
                    that clip into each other
                x-when: you want a world as a dimos sim2 scene to run in simulation
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    project:
                                        type: object
                                        description: the world (dim-world-builder.project.v1); or give name
                                    name:
                                        type: string
                                        description: the name of a saved world to export instead of a project
                                    parentDir:
                                        type: string
                                        description: the folder to write <name>/ into (default ~/dimos_worlds)
        /api/library:
            get:
                description: >-
                    Every placeable 3D asset (built-in library and cooked imports) as a JSON list, each with its id, size
                    and collision pieces
                x-when: you need the ids and sizes of the assets you can place in a world
                x-dimos-role: context
        /api/projects:
            get:
                summary: 'The names of the saved worlds, as { projects: [name] }'
                x-when: you need to know which worlds are saved
                x-dimos-role: context
        /api/open:
            post:
                description: >-
                    Open a world in World Builder for the user: Desktop opens (or switches to) World Builder showing it, and
                    any World Builder page already open switches to it. Give the name of a saved world, a path on this
                    machine (a project .json, an export's scene.json, or an export's folder), or a project as JSON. A
                    project file opened by path keeps saving back to that file. Returns { opened, items, savesTo?, shown,
                    note? }; shown is false when no Desktop window is open (note says why)
                x-when: you want to show the user a world, or open a world file for them to edit
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: a saved world's name (GET /api/projects lists them)
                                    path:
                                        type: string
                                        description: a file or export folder on this machine (~ allowed)
                                    project:
                                        type: object
                                        description: a dim-world-builder.project.v1 project, or an export's scene.json
                                    show:
                                        type: boolean
                                        description: open World Builder in front of the user (default true); false only switches pages already open
        /api/project:
            get:
                description: >-
                    A saved world's project (rooms, stairs, items, floors, movers, nav test) as JSON; 404 if there is no such
                    world
                x-when: you need to read the full contents of a saved world
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
            post:
                description: >-
                    Save (create or replace) a world project under its name (snake_cased); open pages showing it update
                    live (a page with unsaved edits asks first). Returns { saved: name, items: count
                    }; 400 if the project is not dim-world-builder.project.v1
                x-when: you want to save a whole world you built or edited yourself
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    project:
                                        type: object
                                        description: the world (dim-world-builder.project.v1)
        /api/project/items:
            post:
                description: >-
                    Add items to a saved world. Each item: kind (primitive|mesh|room|stairs|hill|hole|apriltag|light|image),
                    params, and optionally name, floor (default the active floor), position [x,y,z], rotation [x,y,z,w],
                    scale, mover, notes (free-text comments shown in the item's panel). Open pages show the new items live.
                    An image item is a reference photo, visual only (never collides, not exported, not in the
                    clip check): params { src (from POST /api/images), width, height (meters), opacity? (0-1, default 1),
                    doubleSided? (default true) }; the picture lies in the item's local y-z plane centered on position (its
                    center, not its base), facing local +x, with +y its right and +z its top as seen from in front. Returns
                    { added: [item id], items: count, warnings }; warnings lists items that now clip into each other
                x-when: you want to add objects, rooms, stairs or obstacles to a saved world
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    items:
                                        type: array
                                        description: the items to add
            patch:
                description: >-
                    Change items of a saved world in place. Each entry names an item by id (or key) and gives the fields to
                    change: name, key, floor, position [x,y,z], rotation [x,y,z,w], scale, mover, notes, and params (merged
                    into the item's params, so { params: { width: 2 } } changes only the width). Open pages show it live.
                    Returns { updated: count, missing: [ids not found], items: count, warnings }; warnings lists items that
                    now clip into each other
                x-when: you want to move, resize, rename, retune or annotate items already in a world
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    items:
                                        type: array
                                        description: '[{ id (or key), ...fields to change }]'
            delete:
                description: >-
                    Remove items from a saved world by id (or key). Open pages show it live. Returns { removed: count,
                    items: count left }
                x-when: you want to remove items from a world
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    ids:
                                        type: array
                                        description: item ids or keys
        /api/project/history:
            get:
                description: >-
                    A saved world's last 50 saved versions, newest first, as { name, versions: [{ version, at (ISO time),
                    source (api: an agent's change; page: the user's edits; undo; before: the world as it was before its
                    history began), items: count }] }. The newest is the world as saved now
                x-when: you need to see how a world changed, or pick a version to go back to
                x-dimos-role: context
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
        /api/project/undo:
            post:
                description: >-
                    Put a saved world back the way it was: to the version before the newest (undoing the last change,
                    whoever made it), or to a given version from GET /api/project/history. The restore is itself a new
                    version, so undoing twice in a row redoes. Open pages show it live. Returns { restored: version, at,
                    items: count }; 404 when there is nothing to go back to
                x-when: you want to revert a change to a world (yours or the user's)
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    version:
                                        type: string
                                        description: a version from GET /api/project/history (default the one before the newest)
        /api/camera:
            get:
                description: >-
                    Where the user is looking in World Builder (the page whose view moved last), as { world, position
                    [x,y,z], target [x,y,z] (the point it orbits and looks at), fov (vertical degrees), updatedAt }, in
                    world meters (z up); 404 until a page has reported one
                x-when: you need to know what part of the world the user is looking at
                x-dimos-role: context
            post:
                description: >-
                    Move the view of the World Builder pages in front of the user: glide to position looking at target
                    (either may be left out to keep the current one), or frame an item (item_id: its id or key). Returns {
                    sent } (false when Desktop could not be reached)
                x-when: you want to show the user something in the world they have open
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    position:
                                        type: array
                                        description: the camera's position [x,y,z], meters
                                    target:
                                        type: array
                                        description: the point to look at [x,y,z], meters
                                    fov:
                                        type: number
                                        description: vertical field of view, degrees (optional)
                                    item_id:
                                        type: string
                                        description: an item's id or key to frame instead of position/target
        /api/highlight:
            post:
                description: >-
                    Make items blink in every open World Builder page for a few seconds, to point them out to the user
                    ("this one?"). Returns { sent } (false when Desktop could not be reached)
                x-when: you want to point at items in the world the user has open
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    ids:
                                        type: array
                                        description: item ids or keys
                                    seconds:
                                        type: number
                                        description: how long they blink (default 3, at most 30)
        /api/selection:
            get:
                description: >-
                    The items the user has selected in World Builder (the page they used most recently), as { world (the
                    open world's saved name, or null), items: [{ id, key, name, kind, floor, position [x,y,z] (meters, z
                    above its floor), rotation [x,y,z,w], scale, params, notes }], updatedAt }; items is [] when nothing is
                    selected. Items are as the page has them, unsaved edits included
                x-when: the user refers to "this", "the selected item" or "what I picked" in World Builder
                x-dimos-role: context
        /api/images:
            post:
                description: >-
                    Store a photo (the raw JPEG or PNG bytes as the request body) for an image item. Returns { id, src };
                    put src in an image item's params (POST /api/project/items with kind image) to place the photo in a
                    world as a flat, visual-only plane. 415 if the body is not a JPEG or PNG
                x-when: you want to place a real photo in a world to compare objects against
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: a short name for the photo, used in its id (optional)
                requestBody:
                    content:
                        image/jpeg:
                            schema:
                                type: string
                                format: binary
                        image/png:
                            schema:
                                type: string
                                format: binary
        /api/generate:
            post:
                description: >-
                    Generate and save a world (playground is a big two-floor test scene; test_course, clutter_yard, empty).
                    Returns { saved: name, items: count, warnings }; warnings lists items that clip into each other
                x-when: you want a ready-made test world to start from
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    kind:
                                        type: string
                                        description: playground | test_course | clutter_yard | empty
                                    name:
                                        type: string
                                        description: the new world's name (optional)
                                    seed:
                                        type: number
                                        description: for playground (optional)
        /api/check:
            post:
                description: >-
                    Which items clip into each other: MuJoCo checks every pair of collision shapes (floors, hills and image
                    items excluded).
                    clips: [{a, b (key, name, kind), depth_m, at [x,y,z]}], warnings: one line each
                x-when: you need to know whether items in a world overlap
                x-dimos-role: context
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: a saved world's name
                                    project:
                                        type: object
                                        description: a world (dim-world-builder.project.v1) instead of a saved one
                                    tolerance:
                                        type: number
                                        description: meters of overlap to ignore (default 0.02)
        /api/views:
            get:
                description: >-
                    A saved world's remembered camera views as { views: [{ key, name, eye, target, fov }] }; each is a MuJoCo
                    camera named by its key in the export
                x-when: you need the camera views remembered for a saved world
                x-dimos-role: context
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
            post:
                description: >-
                    Remember a camera view in a saved world (its key comes from the view's name; the same key replaces it).
                    Returns { saved: key, views: count }
                x-when: you want to remember a camera angle on a saved world
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    view:
                                        type: object
                                        description: '{ name, eye: [x,y,z], target: [x,y,z], fov (vertical degrees, default
                                            50) }'
        /api/views/remove:
            post:
                summary: 'Forget a remembered view of a saved world. Returns { removed: count }'
                x-when: you want to forget a remembered camera view
                requestBody:
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: the world's name
                                    view:
                                        type: string
                                        description: the view's key
        /api/views/image:
            get:
                summary: A PNG of the world (as exported, rendered by MuJoCo) seen from a remembered view
                x-when: you want to see what a world looks like from a remembered view
                x-dimos-role: view
                parameters:
                    -   name: name
                        in: query
                        schema:
                            type: string
                        description: the world's name
                    -   name: view
                        in: query
                        schema:
                            type: string
                        description: the view's key
                    -   name: width
                        in: query
                        schema:
                            type: number
                        description: pixels (default 960, at most 1920)
                    -   name: height
                        in: query
                        schema:
                            type: number
                        description: pixels (default 540, at most 1920)
