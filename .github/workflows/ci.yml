name: ci
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.10 # dimos's pin for its cockpit (dimos/utils/deno.py)
          cache: true
      - run: deno fmt --check
      - run: deno lint
      - name: Deno install (validates deno.lock)
        run: deno install --frozen
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - name: dimos.yaml check
        run: |
          curl -fsSL -o dimos-desktop https://github.com/jeff-hykin/dimos-desktop-mirror/releases/latest/download/dimos-desktop-x86_64-unknown-linux-gnu
          chmod +x dimos-desktop
          ./dimos-desktop app check .
  nix:
    strategy:
      fail-fast: false
      matrix:
        # what Desktop builds on each kind of machine (the page's deno install has one hash per system, flake.nix)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # pulls from dimos-desktop.cachix.org; pushes what it builds only when the CACHIX_AUTH_TOKEN secret is set
      - uses: cachix/cachix-action@v16
        with:
          name: dimos-desktop
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # what Desktop runs on install
      - run: nix build .#dimosApp --print-build-logs
      # on a push to the default branch or a tag: fails unless what Desktop installs here is in the cache (no token: nothing reaches it)
      - if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then echo "::error::CACHIX_AUTH_TOKEN isn't set: this push's builds won't reach the cache"; exit 1; fi
          out=$(readlink -f result)
          cachix push dimos-desktop "$out"
          curl -sfI "https://dimos-desktop.cachix.org/$(basename "$out" | cut -c1-32).narinfo" > /dev/null || { echo "::error::.#dimosApp ($out) isn't in dimos-desktop.cachix.org"; exit 1; }
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
