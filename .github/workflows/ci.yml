name: ci
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.10 # dimos's pin for its cockpit (dimos/utils/deno.py)
          cache: true
      - run: deno fmt --check
      - run: deno lint
      - name: Deno install (validates deno.lock)
        run: deno install --frozen
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - name: dimos.yaml check
        run: |
          curl -fsSL -o dimos-desktop https://github.com/jeff-hykin/dimos-desktop-mirror/releases/latest/download/dimos-desktop-x86_64-unknown-linux-gnu
          chmod +x dimos-desktop
          ./dimos-desktop app check .
  nix:
    strategy:
      fail-fast: false
      matrix:
        # what Desktop builds on each kind of machine (the page's deno install has one hash per system, flake.nix)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest] # no Intel Mac: the Determinate installer dropped it
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pulls from the dimos-nix-cache R2 bucket (where this pushes), then dimos-desktop.cachix.org (older builds)
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://pub-18ed8210d82a4563a7e7269c4ce48a1c.r2.dev https://dimos-desktop.cachix.org
            extra-trusted-public-keys = dimos-nix-cache-1:f6JE9qRFzxGAbwEYBxRkB7LsSYvIVv9BXfhsRm0kqPk= dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ=
      # what Desktop runs on install
      - run: nix build .#dimosApp --print-build-logs
      # on a push to the default branch or a tag: fails unless what Desktop installs here is in the cache (no token: nothing reaches it)
      - if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/'))
        run: |
          if [ -z "$NIX_SIGNING_KEY" ]; then echo "::error::NIX_SIGNING_KEY isn't set: this push's builds won't reach the cache"; exit 1; fi
          out=$(readlink -f result)
          key=$(mktemp) && printf '%s' "$NIX_SIGNING_KEY" > "$key"
          nix copy --to "s3://dimos-nix-cache?endpoint=$R2_CACHE_ENDPOINT&region=auto&secret-key=$key" "$out"
          rm -f "$key"
          curl -sfI --retry 5 --retry-all-errors "https://pub-18ed8210d82a4563a7e7269c4ce48a1c.r2.dev/$(basename "$out" | cut -c1-32).narinfo" > /dev/null || { echo "::error::.#dimosApp ($out) isn't in the R2 cache"; exit 1; }
        env:
          R2_CACHE_ENDPOINT: ${{ vars.R2_CACHE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
